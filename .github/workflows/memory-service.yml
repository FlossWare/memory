name: Memory REST service tests

on:
  pull_request:
    paths:
      - "service/**"
      - ".github/workflows/memory-service.yml"
  push:
    branches: [main]
    paths:
      - "service/**"
      - ".github/workflows/memory-service.yml"

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memory -d memory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MEMORY_TEST_DATABASE_URL: postgresql://memory:memory@localhost:5432/memory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r service/requirements-dev.txt
      - run: pytest -q service/tests
