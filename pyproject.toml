[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flossware-memory"
version = "0.1.0"
description = "Small, composable storage backends for FlossWare Memory"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["flossware_memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
